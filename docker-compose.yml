version: "3.9"

services:
  db:
    image: mysql:8.0
    container_name: inmovacion_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: inmovacion
      MYSQL_USER: user
      MYSQL_PASSWORD: password
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql

  app:
    build: .
    container_name: inmovacion_app
    restart: always
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: mysql://user:password@db:3306/inmovacion
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
      NEXTAUTH_URL: ${NEXTAUTH_URL}
    depends_on:
      - db
    volumes:
      - .:/app
      - /app/node_modules

volumes:
  db_data: